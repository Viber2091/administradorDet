<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Lista De Tarefas</h1>
        <nav>
            <!--    Links de navegações corrigidos com as ãncoras -->
                <a href="">inicio</a>
                <a href="">Tarefas</a>
                <a href="">Contato</a>
        </nav>
    </header>

    <div id="inicio" class="container">
        <h2>Adicionar nova tarefas</h2>
        <div> 
        <input type="text" placeholder="Digite uma tarefa" id="tarefaInput">
        <button onclick="AdicionarTarefa()">Adicionar</button>
    </div>

           <ul id="listaTarefas"></ul>  
       </div>
       <footer id="Contato">
        <p>&copy; 2026 SENAI. Todos os direitos reservados.</p>
       </footer>
       <script>
          let tarefas =[];
          let editandoIndex = null;

          function AdicionarTarefa(){
            const input = document.getElementById('tarefaInput');
            const tarefa = input.value.trim();//remove espaço desnecessários, remove espaços se tiver algum
            if(tarefa){
              if(editandoIndex === null){
                tarefas.push(tarefa); 
              }else{
                tarefas[editandoIndex] = tarefa;
                editandoIndex = null;
              }
                input.value = '';//remove do espço de escrever
                atualizarList();// função que ainda vamos criar

            }
          }  

          function removerTarefa(index){
            tarefas.splice(index, 1);
            atualizarList();//função que ainda vamos criar
          }

          function editarTarefa(index){
              const input = document.getElementById('tarefaInput');
              input.value = tarefas[index];
              editandoIndex = index;
          }

          function atualizarList(){
            const lista = document.getElementById('listaTarefas');
            lista.innerHTML = '';
            tarefas.forEach((tarefa, index) => {   
            const li = document.createElement('li');
            li.innerHTML=`${tarefa}
            <button onclick="editarTarefa(${index})">Editar</button>
             <button onclick="removerTarefa(${index})">remover</button>`;
            lista.appendChild(li);
          });
     }
       </script>
</body>
</html>
